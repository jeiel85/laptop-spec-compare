<!doctype html>
<!-- 링크 미리보기 이미지(og-image.png, 1200×630)의 원본. 고친 뒤 README의 "미리보기 이미지" 명령으로 다시 만들어요 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
:root { --bg: #0f1217; --surface: #171b22; --fg: #e7eaf0; --muted: #9ba3b1; --line: #2a303a; --a: #7c9fff; --b: #ff8a57; --b-soft: #42251a; --track: #232831; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans KR", "Malgun Gothic", sans-serif; padding: 64px 72px; display: grid; grid-template-columns: 1fr 400px; gap: 56px; align-items: center; }
.eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 20px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
h1 { font-size: 64px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; margin-top: 18px; }
h1 em { font-style: normal; color: var(--b); }
.sub { font-size: 26px; color: var(--muted); margin-top: 26px; line-height: 1.5; }
.chips { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
.chip { font-size: 21px; font-weight: 700; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); }
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px 26px 18px; }
.board h2 { font-size: 22px; color: var(--muted); font-weight: 500; margin-bottom: 18px; }
.row { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: center; padding: 13px 0; }
.rank { font-family: "IBM Plex Mono", monospace; font-size: 22px; color: var(--muted); }
.bar { height: 22px; border-radius: 6px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: #3a4150; }
.row.me { grid-template-columns: 34px 1fr auto; margin: 4px -12px; padding: 13px 12px; border-radius: 12px; box-shadow: inset 0 0 0 3px var(--b); background: var(--b-soft); }
.row.me .rank { color: var(--b); }
.row.me .bar i { background: var(--b); }
.row.ref .bar i { background: var(--a); }
.you { font-size: 19px; font-weight: 700; color: var(--b); white-space: nowrap; }
</style>
</head>
<body>
  <div>
    <div class="eyebrow">Spec check · 6초 측정</div>
    <h1>내 기기, 남들 사이에서<br><em>몇 위</em>일까?</h1>
    <p class="sub">브라우저에서 바로 CPU 성능을 재고<br>다른 사람들이 올린 기록과 순위를 비교해요</p>
    <div class="chips"><span class="chip">설치·로그인 없음</span><span class="chip">노트북</span><span class="chip">휴대폰·태블릿</span></div>
  </div>
  <div class="board" aria-hidden="true">
    <h2>다른 사람들과 비교</h2>
    <div class="row"><span class="rank">1</span><div class="bar"><i style="width: 96%"></i></div></div>
    <div class="row me"><span class="rank">2</span><div class="bar"><i style="width: 78%"></i></div><span class="you">내 기기</span></div>
    <div class="row"><span class="rank">3</span><div class="bar"><i style="width: 64%"></i></div></div>
    <div class="row ref"><span class="rank">4</span><div class="bar"><i style="width: 50%"></i></div></div>
    <div class="row"><span class="rank">5</span><div class="bar"><i style="width: 38%"></i></div></div>
  </div>
</body>
</html>
