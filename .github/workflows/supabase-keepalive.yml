name: Supabase keep-alive

on:
  schedule:
    # 6시간마다 (UTC 0·6·12·18시). 핑만으로는 정지를 못 막는 경우가 있어, 정지되면 늦어도 몇 시간 안에 복구하려고 자주 돌려요
    - cron: '0 */6 * * *'
  workflow_dispatch:       # Actions 탭에서 직접 실행

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore if paused, then write heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash .github/scripts/supabase-keepalive.sh
